name: Actualizar datos y publicar

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-embajada
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar noticias, calendario y partido
        env:
          THE_SPORTSDB_KEY: ${{ secrets.THE_SPORTSDB_KEY }}
        run: python3 scripts/update.py

      - name: Generar sitio
        run: python3 scripts/build.py

      - name: Guardar datos actualizados en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "datos: actualización automática $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Publicar dist en gh-pages
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sitio: publicación automática $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
